name: New season watch

# The NBA posts the next season's schedule in mid-August. Nothing rolls over on its own —
# the refresh follows the committed teams.js season — so this watches for the day the new
# schedule lands, opens an issue, and drafts the rollover PR: the rollover is a decision
# rather than a discovery, and the fetching is already done when you make it.
#
# It lives here rather than in a scheduled cloud agent because ESPN's API is not reachable
# from that sandbox — its egress proxy answers `EGRESS_BLOCKED` for site.api.espn.com.
# GitHub's runners reach it fine, which the twice-daily refresh job already proves.
#
# It also carries a second, unrelated watch: whether ESPN's team list for the CURRENT
# season has come back after the 2026-08-26 rebuild that has been failing every refresh
# since. Same shape, same schedule, and it needs no separate workflow.
#
# Quiet by design: a "not yet" run writes a line to the job summary and nothing else. Only
# a real release opens an issue, and only once.

on:
  schedule:
    # The league publishes full schedules at 15:00 ET, so watch just after that rather
    # than mid-morning. 19:05 UTC is 15:05 EDT; the watch only matters in August, so
    # the EST drift is irrelevant.
    - cron: '5 19 * * *'
    # Release-day burst: the 2026-27 schedule drops 2026-08-13 at 15:00 ET, and ESPN
    # takes a while to ingest it — poll every 10 minutes from 15:00 to 19:50 ET that
    # day. Remove after the rollover; left in place it re-fires each Aug 13, which the
    # once-ever issue/branch guards make harmless.
    - cron: '*/10 19-23 13 8 *'
  workflow_dispatch:

# Scheduler delays can bunch burst runs together; the once-ever guards below check
# before they create, so two runs in flight at once could double-file. Queue instead.
concurrency:
  group: new-season-watch
  cancel-in-progress: false

permissions:
  issues: write # the default token is read-only, so opening an issue needs this
  contents: write # push the rollover branch
  pull-requests: write # open the draft rollover PR
  actions: read # the roster watch reads the Refresh workflow's recent conclusions

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Node built-ins only, so no install step.
      # `shell: bash` for the pipefail it brings. GitHub's default is `bash -e`, whose
      # exit status is the LAST command in a pipe — tee, which always succeeds — so a
      # crash in the script left the step green, `released` empty, and every downstream
      # step silently skipped. That hid a real outage on 2026-08-16: the fetch was 403ing
      # and the watch reported success for it.
      - name: Check whether the next season is published
        id: check
        shell: bash
        run: node scripts/check-new-season.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Say what was found
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # One issue per season, ever: the search covers open AND closed, so closing the issue
      # doesn't make tomorrow's run open another.
      - name: Open an issue the day it lands
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ steps.check.outputs.season }}
          YEAR: ${{ steps.check.outputs.year }}
          COUNT: ${{ steps.check.outputs.count }}
          PARTIAL: ${{ steps.check.outputs.partial }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          TITLE="NBA $SEASON schedule is out — roll the viewer over"
          if [ -n "$(gh issue list --state all --search "$TITLE" --json number --jq '.[0].number')" ]; then
            echo "Already filed for $SEASON — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Body via a file, not a heredoc inside $( ): an apostrophe in the prose is enough
          # to break the latter, and it did.
          cat > /tmp/issue-body.md <<EOF
          $SUMMARY

          Found by \`scripts/check-new-season.mjs\` on $(date -u +%Y-%m-%d).
          Partial release: \`$PARTIAL\` ($COUNT regular-season games; a full season is 1,230).

          ## Rolling over

          1. Archive the finished season first — \`node scripts/fetch-history.mjs\`
          2. Pull the new one — \`node scripts/fetch-schedule.mjs --season $YEAR --allow-shrink\`
             (\`--allow-shrink\` is required: the committed season has more games than a
             freshly published schedule, and the shrink guard refuses that by default.)
          3. Expect the suite to fail. Dozens of tests are pinned to the committed data —
             games, standings and leaders — and updating them is the annual rollover chore,
             not a regression.

          The refresh follows the committed season in \`src/data/teams.js\` (since
          28de9bb), so nothing switches on its own — merging the rollover PR is what
          moves the site (and the refresh bot) to the new season.
          EOF
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md

      # And do the fetching, on a branch, as a DRAFT PR — the mechanical half of the
      # rollover, so what is left is the judgement half (retuning the pinned tests).
      #
      # Only on a COMPLETE release. A staged partial would commit half a season, and the
      # branch guard below means it would never re-run to finish it — so a partial release
      # files the issue and waits. The day the full schedule appears, this fires.
      #
      # One PR per season, ever: the branch carries the season, and an existing branch —
      # open, merged, or abandoned — means this already ran. Nothing here re-runs on a
      # branch a human has started editing.
      - name: Draft the rollover PR
        if: steps.check.outputs.released == 'true' && steps.check.outputs.partial == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ steps.check.outputs.season }}
          YEAR: ${{ steps.check.outputs.year }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          BRANCH="season-$SEASON"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch \`$BRANCH\` already exists — rollover PR already drafted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Archive first, while src/data/teams.js still names the FINISHED season:
          # fetch-history's --to defaults to that SEASON, and fetch-schedule is about to
          # rewrite it. (Nothing to do in a year the archive is already current — the
          # write is idempotent, and the diff below decides whether there is a PR.)
          node scripts/fetch-history.mjs
          # --allow-shrink is required: a freshly published season has fewer games than the
          # finished one it replaces, and the shrink guard refuses that drop by default.
          node scripts/fetch-schedule.mjs --season "$YEAR" --allow-shrink

          if git diff --quiet -- src/data public/logos; then
            echo "Fetched $SEASON but nothing changed — no PR opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add -A -- src/data public/logos
          git commit -m "Roll the viewer over to the $SEASON season"
          git push -u origin "$BRANCH"

          # Body via a file for the same reason as the issue above — an apostrophe in the
          # prose is enough to break a heredoc nested in $( ).
          cat > /tmp/pr-body.md <<EOF
          Drafted by \`New season watch\` on $(date -u +%Y-%m-%d): the NBA has published the
          full $SEASON regular season ($COUNT games), so this pulls it in.

          - \`node scripts/fetch-history.mjs\` — archives the finished season
          - \`node scripts/fetch-schedule.mjs --season $YEAR --allow-shrink\` — the new one

          ## What is left for a human

          **The suite will fail, and that is the chore, not a regression.** Dozens of tests
          pin the committed data — games, standings and leaders — and retuning them is the
          annual rollover work. Run \`npm run coverage:badge\` locally and work through it.

          No checks will appear on this PR until then: it was pushed by \`GITHUB_TOKEN\`, and
          GitHub does not trigger workflows on those pushes. Your first commit to
          \`$BRANCH\` starts CI.

          Nothing is urgent — but nothing switches on its own either: the refresh
          follows the committed \`teams.js\` season (since 28de9bb), so the site stays
          on the finished season until this PR merges.
          EOF
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Roll the viewer over to the $SEASON season" --body-file /tmp/pr-body.md

      # ── Roster feed watch ─────────────────────────────────────────────────────────
      # Unrelated to the rollover above, and here only because it wants the same daily
      # cadence. On 2026-08-26 ESPN rebuilt its 2026-27 team collection down to 12
      # franchises, so fetch-schedule's roster guard has refused every refresh since.
      # That is correct, and nothing here can fix it, but a refresh that is EXPECTED to
      # be red trains you to ignore it, and a different failure arriving later would then
      # sit unnoticed. This watches for the day that excuse expires.
      #
      # `shell: bash` for pipefail, for the same reason as the check step above.
      - name: Check whether ESPN's roster feed has recovered
        id: roster
        shell: bash
        run: node scripts/check-roster-feed.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Say what the roster feed looks like
        env:
          SUMMARY: ${{ steps.roster.outputs.summary }}
        run: echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # Only worth a human's attention when BOTH are true: the feed is whole again, so the
      # guard would pass, AND the refresh is still failing anyway, which means it is now
      # failing for some other reason.
      #
      # Two consecutive failures rather than one, because the refresh runs twice daily and
      # this watch fires between them: on the day ESPN recovers, the runs that predate the
      # recovery are legitimately red and a one-failure rule would cry wolf every time.
      # Two still races if ESPN recovers in the hours right before this runs, so the issue
      # body says so rather than pretending otherwise.
      - name: Flag a refresh that should be green and is not
        if: steps.roster.outputs.recovered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ steps.roster.outputs.season }}
          SUMMARY: ${{ steps.roster.outputs.summary }}
        run: |
          CONCLUSIONS=$(gh run list --workflow=refresh-data.yml --branch main \
            --status completed --limit 2 --json conclusion --jq '[.[].conclusion] | join(" ")')
          if [ "$CONCLUSIONS" != "failure failure" ]; then
            echo "Roster feed is whole and the refresh is not stuck ($CONCLUSIONS). Nothing to do." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TITLE="NBA $SEASON refresh is still failing after ESPN's roster feed recovered"
          if [ -n "$(gh issue list --state all --search "$TITLE" --json number --jq '.[0].number')" ]; then
            echo "Already filed for $SEASON. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Body via a file, not a heredoc inside $( ): an apostrophe in the prose is enough
          # to break the latter, and it did.
          cat > /tmp/roster-body.md <<EOF
          $SUMMARY

          The last two \`Refresh data\` runs both failed anyway, so whatever is stopping them
          is no longer the missing teams.

          Found by \`scripts/check-roster-feed.mjs\` on $(date -u +%Y-%m-%d).

          ## What to do

          1. Read the newest failing run: \`gh run list --workflow=refresh-data.yml --limit 3\`
          2. Reproduce locally with \`node scripts/fetch-schedule.mjs\`, which stops at the first
             guard that refuses, and says which.

          ## If this is a false alarm

          One race is possible and expected: if ESPN's list came back in the hours between
          the last refresh and this watch, those two failures predate the recovery and the
          next scheduled refresh will go green on its own. Check that first, and if it does,
          close this; it will not re-file.
          EOF
          gh issue create --title "$TITLE" --body-file /tmp/roster-body.md
